[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "8hr-marathon-main"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langchain-core",
    "langchain-community",
    "langchain-groq",
    "langchain-openai",
    "langchain-google-genai",
    "langgraph",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2.0.0",
    "python-dotenv",
    "qdrant-client",
    "logfire[fastapi,requests]",
    "sentence-transformers",
    "nemoguardrails",
    "portkey-ai",
    "flashrank",
    "requests>=2.34.2",
    "streamlit>=1.59.2",
    "numpy>=2.4.6",
    "pytz>=2026.2",
    "nest-asyncio>=1.6.0",
    "google-generativeai>=0.8.6",
    "langchain-google-vertexai>=3.2.4",
    "unstructured>=0.24.1",
    "python-pptx>=1.0.2",
    "python-docx>=1.2.0",
    "pypdf>=6.14.2",
    "beautifulsoup4>=4.15.0",
    "pdfplumber>=0.11.10",
    "langsmith>=0.10.2",
    "loguru>=0.7.3",
    "langchain-nvidia-ai-endpoints>=1.4.3",
    "ragas>=0.4.3",
    "deepeval>=4.1.0",
    "langfuse>=4.14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
